<br><br><br>

<!-- Contenedor estilo Card con Flowbite -->
<div class="bg-white border border-emerald-200 rounded-2xl shadow-xl overflow-hidden">

    <!-- Header de la Card con el botón de Agregar -->
    <div class="px-8 py-6 bg-gradient-to-r from-emerald-600 via-teal-500 to-cyan-500 flex flex-col sm:flex-row justify-between items-center gap-4">
        <h1 class="text-3xl font-extrabold tracking-tight text-white">Lista Maestros</h1>
        <br><br>
        <!-- Botón Agregar con estilo Flowbite -->
<!--         <button (click)="agregarMaestro()" class="text-white bg-green-700 hover:bg-green-800 focus:ring-4 focus:ring-green-300 font-medium rounded-lg text-sm px-4 py-2 dark:bg-green-600 dark:hover:bg-green-700 focus:outline-none dark:focus:ring-green-800 flex items-center gap-2">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" >
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"></path>
            </svg>
            Agregar
        </button> -->
    </div>

    <!-- Cuerpo de la Card -->
    <div class="p-8 space-y-6 bg-white">

        <!-- Fila de Filtro e Input -->
        <div class="flex flex-col md:flex-row items-center gap-4">
            <div class="w-full md:w-auto font-semibold text-slate-700">
                Filtrar por:
            </div>

            <div class="relative w-full md:w-1/3">
                <div class="absolute inset-y-0 start-0 flex items-center ps-3.5 pointer-events-none">
                    <svg class="w-4 h-4 text-teal-500" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 20 20" >
                        <path stroke-linecap="round" stroke-linejoin="round" d="m19 19-4-4m0-7A7 7 0 1 1 1 8a7 7 0 0 1 14 0Z"></path>
                    </svg>
                </div>
                <input [(ngModel)]="listFilter"
                    type="text"
                    class="bg-white border border-teal-300 text-slate-900 text-sm rounded-full focus:ring-2 focus:ring-teal-400 focus:border-teal-500 block w-full ps-10 p-3 shadow-sm"
                    placeholder="Ingrese nombre del maestro"
                >
            </div>
        </div>

        <!-- Fila de Texto de Filtro Activo -->
        <div>
            <h3 class="inline-flex items-center gap-2 text-sm font-semibold text-teal-700 bg-teal-100 border border-teal-200 px-4 py-1.5 rounded-full">Filtro: {{listFilter}}</h3>
        </div>

        <!-- Tabla responsiva con Flowbite -->
        <div class="relative overflow-x-auto bg-white shadow-lg rounded-xl border border-emerald-100" *ngIf="maestrosIric.length>0">
            <div class="p-4 bg-white border-b border-emerald-100">
                <button (click)="showImage()" class="text-white bg-gradient-to-r from-emerald-500 to-cyan-500 hover:from-emerald-600 hover:to-cyan-600 focus:ring-4 focus:ring-emerald-200 font-semibold rounded-full text-xs px-5 py-2 shadow-md focus:outline-none">
                    {{muestraImagen ? "ocultar" : "Mostrar"}}
                </button>
            </div>

            <table class="w-full text-sm text-left rtl:text-right text-slate-600">
                <thead class="text-xs text-emerald-900 uppercase tracking-wider bg-emerald-100">
                    <tr>
                        <th scope="col" class="px-6 py-4">ID Maestro</th>
                        <th scope="col" class="px-6 py-4">Nombre</th>
                        <th scope="col" class="px-6 py-4">Apaterno</th>
                        <th scope="col" class="px-6 py-4">Amaterno</th>
                        <th scope="col" class="px-6 py-4">Correo</th>
                        <th scope="col" class="px-6 py-4 text-center">Editar</th>
                        <th scope="col" class="px-6 py-4 text-center">Eliminar</th>
                    </tr>
                </thead>

                <tbody>
                    <tr *ngFor="let maestro of dataSource.maestros | maestroFilter:listFilter" class="bg-white border-b border-emerald-50 odd:bg-white even:bg-emerald-50/50 hover:bg-teal-50 transition-colors">
                        <td class="px-6 py-4 whitespace-nowrap">
                            <span class="bg-emerald-100 text-emerald-800 text-xs font-semibold px-2.5 py-1 rounded-md">{{ maestro.idmaestro }}</span>
                        </td>
                        <td class="px-6 py-4 font-semibold text-slate-900">{{ maestro.nombre }}</td>
                        <td class="px-6 py-4">{{ maestro.apaterno }}</td>
                        <td class="px-6 py-4">{{ maestro.amaterno }}</td>
                        <td class="px-6 py-4 text-cyan-700">{{ maestro.correo }}</td>

                        <!-- Botón Editar -->
                        <td class="px-6 py-4 text-center">
                            <button (click)="editarMaestro(maestro)" class="inline-flex items-center gap-1.5 text-white bg-violet-600 hover:bg-violet-700 focus:ring-4 focus:ring-violet-200 font-medium rounded-full text-xs px-4 py-2 shadow-sm focus:outline-none">
                                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                                    <path stroke-linecap="round" stroke-linejoin="round" d="m16.9 3.6 3.5 3.5M4 20l4.5-1 11-11a2.5 2.5 0 0 0-3.5-3.5l-11 11L4 20Z"></path>
                                </svg>
                                Editar
                            </button>
                        </td>

                        <!-- Botón Eliminar -->
                        <td class="px-6 py-4 text-center">
                            <button (click)="eliminarMaestro(maestro)" class="inline-flex items-center gap-1.5 text-white bg-pink-600 hover:bg-pink-700 focus:ring-4 focus:ring-pink-200 font-medium rounded-full text-xs px-4 py-2 shadow-sm focus:outline-none">
                                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                                    <path stroke-linecap="round" stroke-linejoin="round" d="M6 7h12M9 7V4h6v3m-8 0 1 13h8l1-13"></path>
                                </svg>
                                Eliminar
                            </button>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

    </div>
</div>
