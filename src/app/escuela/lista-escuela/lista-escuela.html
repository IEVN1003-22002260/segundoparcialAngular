<div class="max-w-2xl mx-auto p-6 bg-white rounded-lg shadow">
 
  <h1 class="text-3xl font-bold text-gray-900 mb-6">
    Lista Alumnos
  </h1>
 
  <form [formGroup]="formulario">
 
    <!-- Nombre -->
    <div class="mb-5">
 
      <label
        for="matricula"
        class="block mb-2 text-sm font-medium text-gray-900"
      >
        Matricula
      </label>
 
      <input
        type="text"
        id="matricula"
        name="matricula"
        formControlName="matricula"
        required
        class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg
               focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5"
        placeholder="Matricula"
      >
 

 

 
    </div>
 
 
    <!-- Nombre -->
    <div class="mb-5">
 
      <label
        for="nombre"
        class="block mb-2 text-sm font-medium text-gray-900"
      >
        Nombre
      </label>
 
      <input
        type="text"
        id="nombre"
        name="nombre"
        formControlName="nombre"
        required
        class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg
               focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5"
        placeholder="Nombre"
      >
 

 

 
    </div>
 
 
    <!-- Correo -->
    <div class="mb-5">
 
      <label
        for="correo"
        class="block mb-2 text-sm font-medium text-gray-900"
      >
        Correo
      </label>
 
      <input
        type="text"
        id="correo"
        name="correo"
        formControlName="correo"
        required
        class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg
               focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5"
        placeholder="Correo"
      >
 

 

    </div>


    <!-- Materia -->
    <div class="mb-5">
 
      <label
        for="materia"
        class="block mb-2 text-sm font-medium text-gray-900"
      >
        Materia
      </label>
 
      <input
        type="text"
        id="materia"
        name="materia"
        formControlName="materia"
        required
        class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg
               focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5"
        placeholder="Materia"
      >
 
    
 

 
    </div>
